name: Preview

# Publishes work-in-progress branches to the separate GAWI01/gawi-test repository,
# never to gawi.no. The live site is only deployed by deploy.yml from main.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build for /gawi-test/
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
          rm -f dist/CNAME
        env:
          BASE_PATH: /gawi-test/

      - name: Check for the preview token
        id: token
        env:
          PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
        run: |
          if [ -z "$PREVIEW_TOKEN" ]; then
            echo "PREVIEW_TOKEN is not set; built the preview but skipped publishing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GAWI01/gawi-test
        if: steps.token.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PREVIEW_TOKEN }}
          external_repository: GAWI01/gawi-test
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: Preview of ${{ github.repository }}@${{ github.sha }} (${{ github.ref_name }})
